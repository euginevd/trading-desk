name: aws

# One Terraform root per unit in infra/aws/<unit>/: plan with a read-only role, apply after approval.
# dev: a PR plans the units it changes, a merge to main plans every unit and applies the ones with
# changes; prod: a manual run with target prod.
# Repo variables: PROJECT_NAME, optional AWS_REGION (default ap-southeast-2).
# Per environment, from the bootstrap stack: AWS_PLAN_ROLE_ARN, AWS_DEPLOY_ROLE_ARN, TF_STATE_BUCKET.
# Cost comment: secret INFRACOST_API_KEY; optional variables MONTHLY_COST_LIMIT (warns above it) and COST_CURRENCY (default USD).
# Every PR runs it, so plan-result always reports and can be a required check; a PR that changes no
# unit plans nothing.
on:
  pull_request:
  push:
    branches: [main]
    paths: [infra/aws/**, '!infra/aws/bootstrap/**', apps/**, pyproject.toml, uv.lock, .github/workflows/aws.yml]
  workflow_dispatch:
    inputs:
      target:
        description: Environment to deploy to
        type: choice
        options: [dev, prod]
        default: dev
      unit:
        description: Unit folder under infra/aws/, or all
        type: string
        default: all
      action:
        type: choice
        options: [apply, destroy]
        default: apply

permissions:
  contents: read

concurrency:
  group: aws-${{ github.event_name == 'pull_request' && github.ref || inputs.target || 'dev' }}
  cancel-in-progress: false

env:
  # The same version as the Terraform image in security.yml's terraform job.
  TF_VERSION: 1.17.1
  AWS_REGION: ${{ vars.AWS_REGION || 'ap-southeast-2' }}
  TARGET: ${{ inputs.target || 'dev' }}
  PROJECT_NAME: ${{ vars.PROJECT_NAME }}
  TF_VAR_project: ${{ vars.PROJECT_NAME }}
  TF_VAR_environment: ${{ inputs.target || 'dev' }}
  TF_VAR_region: ${{ vars.AWS_REGION || 'ap-southeast-2' }}

jobs:
  detect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      units: ${{ steps.units.outputs.units }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      # Manual run: the chosen unit, or all. Merge to main: every unit, so one an earlier run failed, or left
      # unapproved, is planned again; a unit with no changes uploads no plan and its apply skips.
      # PR: every unit when the workflow or the shared Python packages changed, otherwise the units whose
      # infra/aws/ or apps/ folder changed.
      - id: units
        env:
          EVENT: ${{ github.event_name }}
          INPUT_UNIT: ${{ inputs.unit }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          all=$(find infra/aws -mindepth 1 -maxdepth 1 -type d ! -name bootstrap ! -name '_*' -printf '%f\n')
          if [ "$EVENT" = workflow_dispatch ] && [ "$INPUT_UNIT" = all ]; then
            units="$all"
          elif [ "$EVENT" = workflow_dispatch ]; then
            units=$(echo "$INPUT_UNIT" | grep -Fx "$all" || { echo "No unit infra/aws/$INPUT_UNIT"; exit 1; })
          elif [ "$EVENT" = push ]; then
            units="$all"
          else
            # A diff that can't be read plans every unit.
            changed=$(git diff --name-only "$BASE" "$GITHUB_SHA" 2>/dev/null) || changed=.github/workflows/aws.yml
            if echo "$changed" | grep -qxE '\.github/workflows/aws\.yml|pyproject\.toml|uv\.lock'; then
              units="$all"
            else
              units=$(echo "$changed" | sed -n -E 's#^(infra/aws|apps)/([^/]+)/.*#\2#p' | sort -u | grep -Fx "$all" || true)
            fi
          fi
          echo "units=$(echo "$units" | jq -R . | jq -sc 'map(select(length > 0))')" >> "$GITHUB_OUTPUT"

  # Skipped until the project is bootstrapped and PROJECT_NAME is set.
  plan:
    needs: detect
    if: needs.detect.outputs.units != '[]' && vars.PROJECT_NAME != ''
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: aws-${{ inputs.target || 'dev' }}-plan
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        unit: ${{ fromJson(needs.detect.outputs.units) }}
    defaults:
      run:
        working-directory: infra/aws/${{ matrix.unit }}
    # Passed to the shell as a variable, never pasted into the script.
    env:
      UNIT: ${{ matrix.unit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_PLAN_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - run: terraform fmt -check -recursive
      - run: terraform init -input=false -backend-config="region=$AWS_REGION" -backend-config="bucket=$TF_STATE_BUCKET" -backend-config="key=$PROJECT_NAME/$UNIT.tfstate"
        env:
          TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
      - run: terraform validate

      # -detailed-exitcode: 0 no changes, 2 changes, 1 error.
      - name: Plan
        env:
          DESTROY: ${{ inputs.action == 'destroy' && '-destroy' || '' }}
        run: |
          ec=0
          terraform plan -input=false ${DESTROY:+"$DESTROY"} -out=tfplan -detailed-exitcode || ec=$?
          [ "$ec" -eq 1 ] && exit 1
          terraform show -json tfplan > plan.json
          # No changes: no plan and no zip are kept, so nothing is uploaded and no approval is asked for.
          [ "$ec" -eq 2 ] || rm -f tfplan ./*.zip
          {
            echo "## Terraform plan: $UNIT in $TARGET ${DESTROY}"
            if [ -f tfplan ]; then
              terraform show -no-color tfplan | grep -E '^Plan:' || true
              echo
              echo '<details><summary>Full plan</summary>'
              echo
              echo '```'
              terraform show -no-color tfplan
              echo '```'
              echo '</details>'
            else
              echo 'No changes.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      # Prices the plan from a pinned image; only price lookups leave the runner, and plan.json is deleted after.
      - name: Cost
        env:
          INFRACOST_API_KEY: ${{ secrets.INFRACOST_API_KEY }}
          INFRACOST_CURRENCY: ${{ vars.COST_CURRENCY || 'USD' }}
        run: |
          trap 'rm -f plan.json infracost.json' EXIT
          [ -n "$INFRACOST_API_KEY" ] || { echo "No INFRACOST_API_KEY secret, so no cost estimate."; exit 0; }
          docker run --rm -e INFRACOST_API_KEY -e INFRACOST_CURRENCY -e INFRACOST_SKIP_UPDATE_CHECK=true -v "$PWD:/unit" --entrypoint infracost infracost/infracost:0.10.47@sha256:76ad6948e83bffb4b6127c9cae13faea068981bcb2b081526920d9bb88a399e1 diff --path /unit/plan.json --format json --out-file /unit/infracost.json || true
          python3 ../../../scripts/cost-report.py parse "$UNIT" infracost.json plan.json "cost-$UNIT.json"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cost-${{ matrix.unit }}
          path: infra/aws/${{ matrix.unit }}/cost-${{ matrix.unit }}.json
          if-no-files-found: ignore
          retention-days: 1

      # Only units with changes upload a plan; apply runs for those alone. Zips built at plan time go with it.
      # Never on a PR: nothing applies a PR's plan, and the file holds state in plain text.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: github.event_name != 'pull_request'
        with:
          name: tfplan-${{ matrix.unit }}
          path: |
            infra/aws/${{ matrix.unit }}/tfplan
            infra/aws/${{ matrix.unit }}/*.zip
          if-no-files-found: ignore
          retention-days: 1

  # One check that always reports, so the ruleset can require it: fails when working out the units or
  # any unit's plan failed. A plan skipped (no unit changed, or PROJECT_NAME not set yet) passes. A fork's
  # PR gets no AWS sign-in, so its plan can't run; the merge to main plans it again.
  plan-result:
    needs: [detect, plan]
    if: always() && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - env:
          DETECT: ${{ needs.detect.result }}
          PLAN: ${{ needs.plan.result }}
          FORK: ${{ github.event.pull_request.head.repo.full_name != github.repository }}
        run: |
          [ "$DETECT" = success ] || { echo "::error::Couldn't work out which units to plan."; exit 1; }
          case "$PLAN" in
            success | skipped) echo "Terraform plans: $PLAN" ;;
            *) [ "$FORK" = true ] && { echo "A fork's PR can't sign in to AWS; main plans it after the merge."; exit 0; }
               echo "::error::A Terraform plan failed ($PLAN): see the plan job."; exit 1 ;;
          esac

  # One cost comment per PR, updated on each push; no AWS role.
  cost-report:
    needs: plan
    if: always() && github.event_name == 'pull_request' && needs.plan.result != 'skipped'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true
        with:
          pattern: cost-*
          path: cost
          merge-multiple: true
      - name: Post the estimate on the PR
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha }}
          LIMIT: ${{ vars.MONTHLY_COST_LIMIT }}
        run: |
          python3 scripts/cost-report.py comment cost "$SHA" "$LIMIT" > comment.md
          [ -s comment.md ] || { echo "No cost estimates to post."; exit 0; }
          cat comment.md >> "$GITHUB_STEP_SUMMARY"
          id=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" --paginate --jq '.[] | select(.body | startswith("<!-- cost-report -->")) | .id' | head -1)
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$id" -F body=@comment.md > /dev/null
          else
            gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" -F body=@comment.md > /dev/null
          fi

  # The units whose plan has changes, read from this run's uploaded plans; no AWS role.
  # Runs even when some plans failed, so the units that are ready still apply. A rerun also lists the
  # earlier attempt's plans; one that no longer matches the state fails at apply.
  ready:
    needs: plan
    if: always() && !cancelled() && needs.plan.result != 'skipped' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
    outputs:
      units: ${{ steps.units.outputs.units }}
    steps:
      - id: units
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          names=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" --paginate --jq '.artifacts[].name | select(startswith("tfplan-")) | sub("^tfplan-"; "")')
          echo "units=$(echo "$names" | sort -u | jq -R . | jq -sc 'map(select(length > 0))')" >> "$GITHUB_OUTPUT"

  apply:
    needs: ready
    # Release: only main is applied, so a manual run can't deploy an unreviewed branch.
    # Approval is asked only when a unit has changes to apply.
    if: always() && !cancelled() && needs.ready.result == 'success' && needs.ready.outputs.units != '[]' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: aws-${{ inputs.target || 'dev' }}-apply
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        unit: ${{ fromJson(needs.ready.outputs.units) }}
    defaults:
      run:
        working-directory: infra/aws/${{ matrix.unit }}
    # Passed to the shell as a variable, never pasted into the script.
    env:
      UNIT: ${{ matrix.unit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true
        with:
          name: tfplan-${{ matrix.unit }}
          path: infra/aws/${{ matrix.unit }}

      - id: has_plan
        run: echo "found=$([ -f tfplan ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        if: steps.has_plan.outputs.found == 'true'
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        if: steps.has_plan.outputs.found == 'true'
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - if: steps.has_plan.outputs.found == 'true'
        run: terraform init -input=false -backend-config="region=$AWS_REGION" -backend-config="bucket=$TF_STATE_BUCKET" -backend-config="key=$PROJECT_NAME/$UNIT.tfstate"
        env:
          TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}

      # Applies the reviewed plan exactly; fails if state changed since.
      - if: steps.has_plan.outputs.found == 'true'
        run: terraform apply -input=false tfplan

      # Test: a deployed unit with an api_url output must answer on /health.
      - if: steps.has_plan.outputs.found == 'true' && inputs.action != 'destroy'
        run: |
          url=$(terraform output -raw api_url 2>/dev/null) || { echo "No api_url output, nothing to check"; exit 0; }
          curl --fail --silent --show-error --retry 5 --retry-delay 5 --retry-all-errors "$url/health"
