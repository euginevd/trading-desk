name: claude

# @claude in an issue, a PR comment or a review (decision 103): Claude Code answers, and may push to
# a branch or the PR, as claude[bot]. Only people with write access can call it, and no bot can
# (the action's own checks), so a public repo's strangers can't. It reads AGENTS.md first, as a
# session here does. Runs on the owner's Claude subscription (CLAUDE_CODE_OAUTH_TOKEN).
on:
  # zizmor: ignore[dangerous-triggers] the trigger is the feature: callers gated to the owner and collaborators, and the action checks write access (decision 103, R13)
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  issues:
    types: [opened, assigned]

permissions:
  contents: read

concurrency:
  group: claude-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  claude:
    # Only the owner and collaborators, by the comment's, review's or issue's author association.
    if: >-
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'),
        github.event.comment.author_association || github.event.review.author_association || github.event.issue.author_association) && (
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude'))))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: anthropics/claude-code-action@cc98b3ae241b0fcfb6a42a2690751afffecb4452 # v1.0.278
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          additional_permissions: |
            actions: read
          claude_args: >-
            --model claude-opus-5-5
            --max-turns 40
            --append-system-prompt "Read AGENTS.md and the docs it lists before working, and follow them: one-line commits, no AI attribution lines, never push to main. Keep replies lean: a short list of what you did or found, with links to commits, files and lines; no preamble or restating the request. Asked to fix review findings (fix this, or fix all), fix each at its cause, push to the PR, and reply on each finding's thread with one line and the commit. Asked to record an exception (record this as an exception), add a numbered decision to docs/decisions.md and its record as the others are: what is allowed, why (the asker's reason), who asked, and its scope, kept as narrow as the finding; push it to the PR and reply on the thread with one line and the commit. If the exception would let a real harm through (a secret exposed, an unchecked order amount, auth on a reachable endpoint skipped), still record it as asked, but say the risk plainly in one line of your reply. Never accept or waive a review finding on your own."
