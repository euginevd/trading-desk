name: claude-review

# Claude reviews each PR when it opens or is marked ready (decision 103), in two passes: first
# independently, as an outside reviewer and security auditor, without the repo's docs; then each
# finding checked against the decisions, threat model, trade-offs and rules, dropping what they
# cover. Inline comments that `scripts/pr-findings.sh` lists with the rest (rule 16). Not on
# every push, to spare the plan's usage; ask for another with @claude. Bots' PRs are skipped.
on:
  pull_request:
    types: [opened, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    if: ${{ !github.event.pull_request.draft && github.event.pull_request.user.type != 'Bot' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: anthropics/claude-code-action@cc98b3ae241b0fcfb6a42a2690751afffecb4452 # v1.0.278
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request in two passes, in this order.

            Pass 1, independent. Don't open AGENTS.md, docs/ or guides/ yet. Read the diff
            (`gh pr diff`) and the code around it, as an outside reviewer and security auditor
            would. List every real problem you find: bugs, security flaws (injection, auth,
            secrets in code or logs, unsafe input, money or order mistakes), data loss, race
            conditions, and missing tests on a main path. Note each with its file and line.

            Pass 2, check against the repo's own docs. Now read AGENTS.md, docs/decisions.md and
            the records it links for anything relevant, docs/threat-model.md,
            guides/03-security-trade-offs.md, docs/code-standards.md, and the sections of
            docs/known-mistakes.md for the areas touched. For each finding from pass 1:
            - If a recorded decision or accepted trade-off covers it, drop it, and note it in
              the summary as "covered by <decision or trade-off>".
            - If it breaks a project rule, keep it and cite the rule.
            - Otherwise keep it: the docs are silent, which is what this pass is for.
            Then add anything the diff does against a project rule that pass 1 missed.

            Post each kept finding as an inline comment on its line: the problem, why it matters,
            and a one-line fix, marked blocker, should-fix or nit. Then post one short summary
            with `gh pr comment`: what blocks (or plainly "nothing blocks"), and the findings
            dropped in pass 2 with what covers each. Don't praise, restate the diff, or comment
            on style the linters already check.
          claude_args: >-
            --model claude-opus-5-5
            --max-turns 30
            --allowedTools "Read,Glob,Grep,mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
