name: claude-review

# Claude reviews each PR (decision 103), in two passes: first independently, as an outside
# reviewer and security auditor, without the repo's docs; then each finding checked against the
# decisions, threat model, trade-offs and rules, dropping what they cover. Inline comments that
# `scripts/pr-findings.sh` lists with the rest (rule 16), and one summary, kept up to date.
# A gate: the check fails while an open 🔴 blocker remains, so it re-reviews on every push.
# If Claude can't run (the plan's limit, an outage), it warns and doesn't block. Bots' PRs skip.
on:
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize]

permissions:
  contents: read

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    if: ${{ !github.event.pull_request.draft && github.event.pull_request.user.type != 'Bot' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - id: claude
        uses: anthropics/claude-code-action@cc98b3ae241b0fcfb6a42a2690751afffecb4452 # v1.0.278
        continue-on-error: true # a run that can't happen warns below rather than blocks
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request in two passes, in this order.

            Pass 1, independent. Don't open AGENTS.md, docs/ or guides/ yet. Read the diff
            (`gh pr diff`) and the code around it, as an outside reviewer and security auditor
            would. List every real problem you find: bugs, security flaws (injection, auth,
            secrets in code or logs, unsafe input, money or order mistakes), data loss, race
            conditions, and missing tests on a main path. Note each with its file and line.

            Pass 2, check against the repo's own docs. Now read AGENTS.md, docs/decisions.md and
            the records it links for anything relevant, docs/threat-model.md,
            guides/03-security-trade-offs.md, docs/code-standards.md, and the sections of
            docs/known-mistakes.md for the areas touched. For each finding from pass 1:
            - If a recorded decision or accepted trade-off covers it, drop it, and note it in
              the summary as "covered by <decision or trade-off>".
            - If it breaks a project rule, keep it and cite the rule.
            - Otherwise keep it: the docs are silent, which is what this pass is for.
            Then add anything the diff does against a project rule that pass 1 missed.

            A re-review (this PR already has your comments): read the existing review comments
            and their replies first, with
            `gh api repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/comments`.
            Don't post a finding again that's already there. A finding is closed when the code no
            longer has it, or when the owner replied accepting it or naming what covers it; reply
            "✅ Fixed" or "✅ Accepted" on its thread once, then leave it.

            How to post: lean, visual, actionable. Rate each finding 🔴 Blocker, 🟠 Should-fix
            or ⚪ Nit.

            Inline comments, for new 🔴 and 🟠 only, one per finding, at most three short lines:
              🔴 **Blocker:** <the problem, with a concrete example, in one line>
              **Why:** <what goes wrong for the owner, in one line>
              **Fix:** <one line>
            When the fix is five lines or fewer on the commented lines, give it as a GitHub
            ```suggestion block instead of the Fix line, so it can be committed in one click.

            Then one summary with `gh pr comment --edit-last --create-if-none`, so a re-review
            updates it, in this shape and nothing more:
              ### 🔴 <n> blocker · 🟠 <n> should-fix · ⚪ <n> nit
              A table: | | Finding | Where |, one row per open finding, a few words each, Where
              as a link to the file and line in this PR.
              <details><summary>Dropped in pass 2 (<n>)</summary> one line each: the finding,
              then "covered by <decision or trade-off>"</details>
              **Next:** reply `@claude fix this` on a finding, or `@claude fix all` here. A 🔴
              blocks the merge until it's fixed, or you reply accepting it and push.
            Leave out any part with nothing in it. If nothing is open, the whole summary is
            "✅ Nothing blocks." plus the dropped list if there is one.

            Don't praise, restate the diff, explain what you checked, or comment on style the
            linters already check.

            Finally return `blockers`: the number of open 🔴 findings, after closing those
            fixed or accepted.
          claude_args: >-
            --model claude-opus-5-5
            --max-turns 40
            --json-schema '{"type":"object","properties":{"blockers":{"type":"integer","minimum":0}},"required":["blockers"]}'
            --allowedTools "Read,Glob,Grep,mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh api repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/comments:*)"
      - name: The gate, on open blockers
        env:
          OUTCOME: ${{ steps.claude.outcome }}
          RESULT: ${{ steps.claude.outputs.structured_output }}
        run: |
          if [ "$OUTCOME" != "success" ] || [ -z "$RESULT" ]; then
            echo "::warning::Claude's review didn't run (the plan's limit, an outage, or a workflow change on this PR): not gating. Ask for one with @claude review."
            exit 0
          fi
          blockers=$(printf '%s' "$RESULT" | jq -r '.blockers // 0')
          if [ "$blockers" -gt 0 ]; then
            echo "::error::Claude's review has $blockers open blocker(s): fix each, or reply accepting it, then push."
            exit 1
          fi
          echo "No open blockers."
