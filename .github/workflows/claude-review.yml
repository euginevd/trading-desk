name: claude-review

# Claude reviews each PR (decision 103), in two passes: first independently, as an outside
# reviewer and security auditor, without the repo's docs; then each finding checked against the
# decisions, threat model, trade-offs and rules, dropping what they cover. Inline comments that
# `scripts/pr-findings.sh` lists with the rest (rule 16), and one summary, kept up to date.
# A gate: the check fails while an open 🔴 blocker remains, so it re-reviews on every push.
# If Claude can't run (the plan's limit, an outage), it says so on the PR, and FAIL_CLOSED in the
# gate step decides whether that blocks. Bots' PRs skip; Claude's own pushes are reviewed.
on:
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize]

permissions:
  contents: read

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    if: ${{ !github.event.pull_request.draft && github.event.pull_request.user.type != 'Bot' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - id: claude
        uses: anthropics/claude-code-action@cc98b3ae241b0fcfb6a42a2690751afffecb4452 # v1.0.278
        continue-on-error: true # a run that can't happen warns below rather than blocks
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Claude's own fixes are pushed as the claude app: review them too, or its push would
          # skip the review and open the gate (known-mistakes 8e).
          allowed_bots: claude
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request in two passes, in this order.

            Pass 1, independent. Don't open AGENTS.md, docs/ or guides/ yet. Read the diff
            (`gh pr diff`) and the code around it, as an outside reviewer and security auditor
            would. List every real problem you find: bugs, security flaws (injection, auth,
            secrets in code or logs, unsafe input, money or order mistakes), data loss, race
            conditions, and missing tests on a main path. Note each with its file and line.

            Pass 2, check against the repo's own docs. Now read AGENTS.md, docs/decisions.md and
            the records it links for anything relevant, docs/threat-model.md,
            guides/03-security-trade-offs.md, docs/code-standards.md, and the sections of
            docs/known-mistakes.md for the areas touched. For each finding from pass 1:
            - If a recorded decision or accepted trade-off covers it, drop it, and note it in
              the summary as "covered by <decision or trade-off>".
            - If it breaks a project rule, keep it and cite the rule.
            - Otherwise keep it: the docs are silent, which is what this pass is for.
            Then add anything the diff does against a project rule that pass 1 missed.

            A re-review (this PR already has your comments): read the existing review comments
            and their replies first, with
            `gh api repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/comments`.
            Don't post a finding again that's already there. A finding is closed only when:
            - the code no longer has it ("✅ Fixed"), or
            - a decision or trade-off now covers it, such as one added in this PR ("✅ Covered
              by <decision>"), or
            - a person accepted it: a reply on its thread whose author_association is OWNER,
              MEMBER or COLLABORATOR, not a bot, starting "Accepted:" with a reason after it
              ("✅ Accepted by @<login>: <reason>").
            Anything else, including a reply with no reason, leaves it open. You never accept a
            finding yourself. Reply on its thread once when it closes, then leave it.

            How to post: lean, visual, actionable. Rate each finding 🔴 Blocker, 🟠 Should-fix
            or ⚪ Nit.

            Inline comments, for new 🔴 and 🟠 only, one per finding, blockers first, exactly
            three lines of at most 20 words each, with only the single worst example:
              🔴 **Blocker:** <the problem and one concrete example>
              **Why:** <what goes wrong for the owner>
              **Fix:** <the change>
            When the fix is five lines or fewer on the commented lines, give it as a GitHub
            ```suggestion block instead of the Fix line, so it can be committed in one click.

            Then one summary with `gh pr comment --edit-last --create-if-none`, so a re-review
            updates it, in this shape and nothing more:
              ### ⛔ Merge blocked · <n> blocker · <n> should-fix · <n> nit
              (or "### ✅ Ready to merge · <n> should-fix · <n> nit" when no 🔴 is open)
              A table: | Rating | Finding | Where |, one row per open finding, blockers first.
              Rating is the dot and its word ("🔴 Blocker", "🟠 Should-fix", "⚪ Nit"), never
              the dot alone. Finding is a few words. Where links to that finding's inline
              comment (its `html_url`, from the comments list above), shown as file:line.
              <details><summary>Dropped in pass 2 (<n>)</summary> one line each: the finding,
              then "covered by <decision or trade-off>"</details>
              <details><summary>Accepted (<n>)</summary> one line each: the finding, then
              "✅ Accepted by @<login>: <reason>"</details>
              **Next:** on a finding's thread, reply `@claude fix this`; `Accepted: <reason>` for
              this PR only; or `@claude record this as an exception: <reason>` to allow it from
              now on. Or comment `@claude fix all` at the bottom of the PR. A 🔴 blocks the merge
              until it's closed; push, or close and reopen the PR, to re-check.
            Leave out any part with nothing in it. If nothing is open, the whole summary is
            "✅ Nothing blocks." plus the dropped and accepted lists if there are any.

            Don't praise, restate the diff, explain what you checked, or comment on style the
            linters already check.

            Finally return `blockers`: the number of open 🔴 findings, after closing those
            fixed or accepted.
          claude_args: >-
            --model claude-opus-5-5
            --max-turns 40
            --json-schema '{"type":"object","properties":{"blockers":{"type":"integer","minimum":0}},"required":["blockers"]}'
            --allowedTools "Read,Glob,Grep,mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh api repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/comments:*)"
      - name: The gate, on open blockers
        env:
          OUTCOME: ${{ steps.claude.outcome }}
          RESULT: ${{ steps.claude.outputs.structured_output }}
          PR: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          # When the review doesn't run: "true" blocks the merge, "false" lets it through. A PR
          # that changes Claude's workflows always passes, as Claude can't run on it.
          FAIL_CLOSED: "true"
        run: |
          if [ "$OUTCOME" != "success" ] || [ -z "$RESULT" ]; then
            if gh pr diff "$PR" --name-only | grep -q '^\.github/workflows/claude'; then
              echo "::warning::This PR changes Claude's workflows, so the review can't run on it: passing."
              exit 0
            fi
            if [ "$FAIL_CLOSED" = "true" ]; then
              note="⚠️ **Claude's review didn't run**, so the merge stays blocked. Push or reopen the PR to retry; see the run's log for why."
              code=1
            else
              note="⚠️ **Claude's review didn't run**, so this PR isn't gated: check it yourself before merging. Push or reopen the PR to retry; see the run's log for why."
              code=0
            fi
            gh pr comment "$PR" --body "$note"
            echo "::warning::Claude's review didn't run."
            exit "$code"
          fi
          blockers=$(printf '%s' "$RESULT" | jq -r '.blockers // 0')
          if [ "$blockers" -gt 0 ]; then
            echo "::error::Claude's review has $blockers open blocker(s): fix each, or reply accepting it, then push."
            exit 1
          fi
          echo "No open blockers."
