# The desk's pages, and the api behind /api (decision 14). The browser's Host and Origin pass
# through unchanged, so the api's checks against cross-site calls still apply (threat model R1).
server {
    listen 8080;
    server_tokens off;
    root /usr/share/nginx/html;

    # Only TradingView's widget site may be framed (decision 22); no third-party script runs here.
    add_header Content-Security-Policy "default-src 'self'; frame-src https://www.tradingview-widget.com; img-src 'self' data:; font-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;

    location /api/ {
        proxy_pass http://api:8000/;
        proxy_set_header Host $http_host;
        proxy_read_timeout 200s; # an AI signal with web search can take a minute or two
        client_max_body_size 16k;
    }

    location / {
        try_files $uri /index.html;
    }
}
