# The desk on your machine (decision 14): docker compose up --build, then http://127.0.0.1:5180
# (or the DESK_PORT you set in .env).
# Only the desk is published, and only on 127.0.0.1; the api is reachable from the desk alone.
name: trading-desk

services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    env_file:
      - path: .env
        required: true
    environment:
      # The api answers only the desk's own page, on whichever port it's published.
      DESK_ORIGINS: http://127.0.0.1:${DESK_PORT:-5180},http://localhost:${DESK_PORT:-5180}
      # The Settings page saves the Claude API key and sign-in token here (decision 51).
      DESK_ENV_FILE: /app/.env
      # The paper bot (below) may call the api by its service name to ask trading-agent.
      DESK_HOSTS: api:8000
    volumes:
      - ./local:/app/local # SQLite and the audit log stay on your disk
      - ./.env:/app/.env # read at start; the Settings page writes the AI credentials back
    restart: unless-stopped
    # No Linux capabilities and no privilege gain: both run as non-root and need neither.
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]

  desk:
    build:
      context: .
      dockerfile: apps/desk/Dockerfile
    ports:
      - "127.0.0.1:${DESK_PORT:-5180}:8080"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    # No Linux capabilities and no privilege gain: both run as non-root and need neither.
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]

  # Backtests and paper trading of the desk's styles (apps/backtest), on demand only:
  #   bash apps/backtest/run.sh swing        (or scalp, day, position, swing-ai, all)
  #   PAPER_STRATEGY=DeskSwingAI PAPER_AI=ai-swing.json docker compose --profile paper up -d paper
  # The strategies call the desk's own screener (mounted read-only), so they test the same
  # rules New trade uses. No keys: Binance's public candles only; nothing is ever placed.
  backtest: &freqtrade
    image: freqtradeorg/freqtrade:2026.10_freqai # the latest release, with FreqAI's models
    profiles: [backtest]
    environment:
      PYTHONPATH: /desk
      DESK_QUOTE: USDT
    volumes:
      - ./local/backtest:/freqtrade/user_data # candles, results and the paper bot's database
      - ./apps/backtest/strategies:/freqtrade/user_data/strategies:ro
      - ./apps/backtest/config:/freqtrade/config:ro
      - ./apps/backtest/report.py:/freqtrade/report.py:ro
      - ./apps/api/src:/desk:ro
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]

  # The Backtest page's runs (decision 85): the api queues a checked request in
  # local/backtest/jobs and this runs it, one at a time. No port, no keys, no Docker socket.
  backtest-worker:
    <<: *freqtrade
    profiles: []
    entrypoint: ["python", "/freqtrade/worker.py"]
    environment:
      PYTHONPATH: /desk
      DESK_QUOTE: USDC # one coin against USDC, as on the Trade page
    volumes:
      - ./local/backtest:/freqtrade/user_data
      - ./apps/backtest/strategies:/freqtrade/user_data/strategies:ro
      - ./apps/backtest/config:/freqtrade/config:ro
      - ./apps/backtest/worker.py:/freqtrade/worker.py:ro
      - ./apps/api/src:/desk:ro
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import json,time; s=json.load(open('/freqtrade/user_data/jobs/worker.json'))['seen']; exit(time.time()*1000-s > 30000)"
      interval: 30s
      timeout: 5s
      start_period: 20s
    restart: unless-stopped

  paper:
    <<: *freqtrade
    profiles: [paper]
    environment:
      PYTHONPATH: /desk
      DESK_QUOTE: USDC
      # Each entry asks trading-agent first; only a take goes ahead (agent_verdicts.jsonl).
      DESK_AGENT_URL: http://api:8000/pot/judge-one
      DESK_AGENT_MAX_PER_DAY: ${DESK_AGENT_MAX_PER_DAY:-20} # trading-agent calls a day, at most
    command: >-
      trade --config /freqtrade/config/paper.json
      ${PAPER_AI:+--config /freqtrade/config/$PAPER_AI}
      --strategy ${PAPER_STRATEGY:-DeskSwing} --dry-run
    restart: unless-stopped
