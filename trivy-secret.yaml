# Trivy secret scanning: one allowance, for a confirmed false positive (decision 47).
# The Anthropic SDK's own docs say `{"type": "service_account"}`, which Trivy's Google
# service account rule reads as a key. Only that text, only inside the SDK, is allowed.
allow-rules:
  - id: anthropic-sdk-service-account-docs
    description: Anthropic SDK docstrings naming the service_account credential type
    path: .*site-packages/anthropic/.*
    regex: '"type": "service_account"'
