# Python workspace: one member per app in apps/. Tool settings for every Python app live here.
[project]
name = "starter"
version = "0.1.0"
requires-python = ">=3.13,<3.14"
dependencies = ["api"]

[tool.uv]
package = false
# Packages must be a week old before uv picks them (AGENTS.md rule 24).
exclude-newer = "7 days"

[tool.uv.workspace]
members = ["apps/api"]

[tool.uv.sources]
api = { workspace = true }

[dependency-groups]
dev = ["pyright[nodejs]==1.1.414", "pytest==9.2.0", "pytest-cov==7.1.0", "ruff==0.17.4"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "SIM", "UP", "PL", "S", "PT", "C90"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.per-file-ignores]
"apps/*/tests/*" = ["S101", "PLR2004"]
"scripts/tests/*" = ["S101", "PLR2004"]

[tool.pyright]
include = ["apps"]
exclude = ["**/node_modules", "**/.venv"]
typeCheckingMode = "strict"
pythonVersion = "3.13"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["apps", "scripts/tests"]
addopts = "--import-mode=importlib --cov --cov-report=term-missing"

[tool.coverage.run]
source = ["apps"]
omit = ["*/tests/*"]

[tool.coverage.report]
fail_under = 80
